plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mapmatcher'
version = '0.7.10'

android {
  namespace "expo.modules.mapmatcher"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation(name: 'online_mapmatcher', ext: 'aar')
}
